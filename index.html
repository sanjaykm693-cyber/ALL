<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sapphire One — Back Office</title>
<style>
/* Structural stylesheet shared by every design. Palette, type and shape come from the
   design file through CSS custom properties; the three navigation layouts live here. */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:var(--fs,13.5px);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}
a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);margin:0}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.big{width:40px;height:40px}
kbd{font:600 10.5px var(--font-mono);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--surface)}

/* ---------------------------------------------------------------- app grid */
.app{min-height:100vh;display:grid;grid-template-columns:var(--side-w,264px) 1fr;grid-template-rows:var(--top-h,60px) 1fr auto;grid-template-areas:"top top" "side main" "foot foot"}
.topbar{grid-area:top;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:0 18px;background:var(--topbar-bg);color:var(--topbar-text);border-bottom:1px solid var(--topbar-border,var(--border));box-shadow:var(--topbar-shadow,none)}
.sidebar{grid-area:side;position:sticky;top:var(--top-h,60px);height:calc(100vh - var(--top-h,60px));overflow:auto;display:flex;flex-direction:column;background:var(--nav-bg);color:var(--nav-text);border-right:1px solid var(--nav-border,var(--border))}
.main{grid-area:main;padding:var(--main-pad,24px 28px 40px);min-width:0}
.foot{grid-area:foot;display:flex;justify-content:space-between;gap:16px;padding:12px 28px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:var(--foot-bg,var(--surface))}
.scrim{display:none}
.hamburger{display:none}

/* topbar pieces */
.brand{display:flex;align-items:center;gap:10px;color:inherit;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:var(--mark-radius,9px);display:grid;place-items:center;font:700 16px var(--font-head);background:var(--accent);color:var(--accent-ink);flex:none}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text b{font-family:var(--font-head);font-size:14px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{font-size:11px;opacity:.7}
.topbar-mid{display:flex;align-items:center;gap:12px;flex:1;justify-content:center;min-width:0}
.topbar-mid>*{flex:none}
.topbar-right{flex:none}
.topbar-right{display:flex;align-items:center;gap:14px}
.gsearch{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;min-width:240px;border:1px solid var(--topbar-field-border,var(--border));border-radius:var(--radius);background:var(--topbar-field,var(--surface));color:var(--muted);cursor:pointer;text-align:left}
.gsearch span{flex:1;font-size:12.5px}
.seg-toggle{display:flex;border:1px solid var(--topbar-field-border,var(--border));border-radius:var(--radius);overflow:hidden;background:var(--topbar-field,var(--surface))}
.seg{border:0;background:transparent;padding:0 14px;height:34px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg.on{background:var(--accent);color:var(--accent-ink)}
.exch-sel{height:36px;border:1px solid var(--topbar-field-border,var(--border));border-radius:var(--radius);background:var(--topbar-field,var(--surface));padding:0 10px;font-weight:600;font-size:12.5px}
.meta{display:flex;gap:16px;font-size:11.5px;opacity:.85;white-space:nowrap}
.meta b{font-weight:600}
.user{display:flex;align-items:center;gap:9px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.user-text{display:flex;flex-direction:column;line-height:1.15}
.user-text b{font-size:12.5px}.user-text small{font-size:11px;opacity:.7}
.ibtn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--radius);background:transparent;cursor:pointer;color:inherit}
.ibtn:hover{background:var(--hover)}
.ibtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--neg);border:2px solid var(--topbar-bg)}

/* navigation */
.sidebar-head{padding:16px 18px 6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.nav{padding:4px 10px}
.nav-sec-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--radius);background:transparent;color:inherit;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
.nav-sec-btn:hover{background:var(--nav-hover)}
.nav-sec.current>.nav-sec-btn{color:var(--nav-active-text);background:var(--nav-active)}
.nav-sec-btn span{flex:1}
.nav-sec-btn .chev{width:14px;height:14px;transition:transform .2s;opacity:.6}
.nav-sec.open>.nav-sec-btn .chev{transform:rotate(90deg)}
.nav-sec-btn .count{font:600 10.5px var(--font-mono);opacity:.5;font-style:normal}
.nav-items{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.nav-sec.open>.nav-items{grid-template-rows:1fr}
.nav-items-in{overflow:hidden;display:flex;flex-direction:column;padding-left:22px;position:relative}
.nav-items-in::before{content:"";position:absolute;left:18px;top:6px;bottom:8px;width:1px;background:var(--nav-line)}
.nav-item{display:block;padding:6px 10px 6px 14px;border-radius:var(--radius);color:var(--nav-text);font-size:12.5px;opacity:.85;position:relative}
.nav-item:hover{background:var(--nav-hover);opacity:1}
.nav-item.active{background:var(--nav-active);color:var(--nav-active-text);opacity:1;font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-4px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
.nav-favs{margin:10px 10px 0;padding:10px;border-top:1px solid var(--nav-line)}
.nav-favs-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.6;padding:4px 6px 8px}
.nav-favs .nav-item{padding-left:10px}
.sidebar-foot{margin-top:auto;padding:14px 18px;font-size:11px;opacity:.55}

/* ---- topnav layout */
body[data-layout=topnav] .app{grid-template-columns:1fr;grid-template-rows:var(--top-h,60px) auto 1fr auto;grid-template-areas:"top" "side" "main" "foot"}
body[data-layout=topnav] .sidebar{position:sticky;top:var(--top-h,60px);height:auto;flex-direction:row;align-items:center;padding:0 22px;border-right:0;border-bottom:1px solid var(--nav-border,var(--border));z-index:30;overflow:visible}
body[data-layout=topnav] .sidebar-head,body[data-layout=topnav] .sidebar-foot,body[data-layout=topnav] .nav-favs{display:none}
body[data-layout=topnav] .nav{display:flex;gap:2px;padding:0}
body[data-layout=topnav] .nav-sec{position:relative}
body[data-layout=topnav] .nav-sec-btn{padding:13px 14px;border-radius:0;border-bottom:3px solid transparent;margin-bottom:-1px}
body[data-layout=topnav] .nav-sec.current>.nav-sec-btn{background:transparent;border-bottom-color:var(--accent)}
body[data-layout=topnav] .nav-sec-btn .chev{transform:rotate(90deg)}
body[data-layout=topnav] .nav-sec.open>.nav-sec-btn .chev{transform:rotate(-90deg)}
body[data-layout=topnav] .nav-items{position:absolute;top:100%;left:0;display:none;min-width:250px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;z-index:50}
body[data-layout=topnav] .nav-sec.open>.nav-items{display:block}
body[data-layout=topnav] .nav-items-in{padding:0;overflow:visible;display:grid;grid-template-columns:repeat(var(--cols,1),1fr)}
body[data-layout=topnav] .nav-sec[data-key=report] .nav-items{min-width:560px;--cols:2}
body[data-layout=topnav] .nav-sec[data-key=financial] .nav-items,body[data-layout=topnav] .nav-sec[data-key=request] .nav-items{min-width:520px;--cols:2}
body[data-layout=topnav] .nav-items-in::before{display:none}
body[data-layout=topnav] .nav-item{color:var(--text);padding:8px 12px}
body[data-layout=topnav] .main{max-width:var(--max-w,1480px);width:100%;margin:0 auto}
body[data-layout=topnav] .nav-sec-btn .count{display:none}

/* ---- rail layout */
body[data-layout=rail] .app{grid-template-columns:72px 1fr}
body[data-layout=rail] .sidebar{overflow:visible;align-items:stretch;z-index:35}
body[data-layout=rail] .sidebar-head,body[data-layout=rail] .nav-favs,body[data-layout=rail] .sidebar-foot{display:none}
body[data-layout=rail] .nav{padding:8px 8px}
body[data-layout=rail] .nav-sec{position:relative;margin-bottom:4px}
body[data-layout=rail] .nav-sec-btn{flex-direction:column;gap:5px;padding:9px 4px;font-size:10px;font-weight:600;text-align:center}
body[data-layout=rail] .nav-sec-btn .ic{width:21px;height:21px}
body[data-layout=rail] .nav-sec-btn .chev,body[data-layout=rail] .nav-sec-btn .count{display:none}
body[data-layout=rail] .nav-items{position:absolute;left:calc(100% + 6px);top:0;display:none;min-width:260px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:8px;z-index:60}
body[data-layout=rail] .nav-sec.open>.nav-items{display:block}
body[data-layout=rail] .nav-items-in{padding:0;overflow:visible}
body[data-layout=rail] .nav-items-in::before{display:none}
body[data-layout=rail] .nav-sec[data-key=report] .nav-items{min-width:520px}
body[data-layout=rail] .nav-sec[data-key=report] .nav-items-in{display:grid;grid-template-columns:1fr 1fr}
body[data-layout=rail] .nav-item{color:var(--text);padding:8px 12px}

/* ------------------------------------------------------------- page pieces */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.crumbs i{font-style:normal;opacity:.5}
.crumbs b{font-weight:600;color:var(--text)}
h1{font-size:var(--h1,24px);font-weight:var(--h1-w,700);letter-spacing:var(--h1-ls,-.01em);display:flex;align-items:center;gap:12px}
.seg-badge{font:600 11px var(--font);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.desc{margin:6px 0 0;color:var(--muted);max-width:760px}
.page-actions{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--btn-shadow,none)}
.btn-primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn-ghost{background:transparent}
.btn-ghost.on{color:var(--warn)}
.btn-danger{background:var(--neg);border-color:var(--neg);color:#fff}
.btn-sm{height:30px;padding:0 10px;font-size:12px}
.btn .ic{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg,var(--radius));box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card-title{display:flex;align-items:baseline;gap:10px;font-family:var(--font-head);font-weight:700;font-size:14.5px;margin-bottom:14px}
.card-title small{font-weight:500;font-size:12px;color:var(--muted);font-family:var(--font)}
.card.sub{border-left:3px solid var(--accent)}
.hidden{display:none!important}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.two-col>.card{margin-bottom:0}
.two-col+.result-host{margin-top:18px}

/* filters / forms */
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:span 2}
.field label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.field input:not([type=radio]):not([type=checkbox]),.field select,.editable input,.editable select,.tsearch,.captcha input{height:36px;padding:0 10px;border:1px solid var(--field-border,var(--border));border-radius:var(--radius);background:var(--field-bg,var(--surface));color:var(--text);width:100%;min-width:0}
.field input:focus,.field select:focus,.tsearch:focus,.editable input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.radios{display:flex;flex-wrap:wrap;gap:4px 14px;min-height:36px;align-items:center}
.radio{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.radio input{width:15px;height:15px;margin:0;flex:none}
.filter-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--border)}
.filter-presets{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);font-size:12px;cursor:pointer}
.chip .ic{width:13px;height:13px}
.filter-actions{display:flex;gap:8px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.form-actions.left{justify-content:flex-start}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:12px}
.checks{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.checks.col{flex-direction:column;align-items:flex-start;gap:4px}
.checks .check{margin:0}
.check.box{border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;background:var(--surface2)}
.checks .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.steps{display:flex;gap:0;list-style:none;padding:0;margin:0 0 18px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.steps li{flex:1;display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;color:var(--muted);background:var(--surface2);border-right:1px solid var(--border)}
.steps li:last-child{border-right:0}
.steps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--border);color:var(--text)}
.steps li.on{color:var(--text);background:var(--surface);font-weight:600}
.steps li.on span{background:var(--accent);color:var(--accent-ink)}
.captcha{display:flex;gap:8px}
.cap-img{display:grid;place-items:center;padding:0 12px;border-radius:var(--radius);font:700 15px var(--font-mono);letter-spacing:.2em;background:repeating-linear-gradient(135deg,var(--surface2),var(--surface2) 4px,var(--border) 4px,var(--border) 5px);color:var(--text);white-space:nowrap}
.gate{max-width:440px;margin:40px auto;text-align:center;padding:32px}
.gate .ic.big{color:var(--accent);margin:0 auto 10px}
.gate h3{font-size:18px;margin-bottom:6px}
.gate p{color:var(--muted);margin:0 0 16px}
.gate .field{text-align:left;margin-bottom:14px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);background:var(--accent-soft);color:var(--text);font-size:12.5px;margin-top:14px}
.notice .ic{color:var(--accent);margin-top:1px}
.notice.info{margin:0 0 18px}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px;border:2px dashed var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;color:var(--muted);margin-bottom:14px}
.dropzone .ic{width:28px;height:28px;color:var(--accent)}
.dropzone b{color:var(--text)}
.dropzone.drag,.dropzone:focus-visible{border-color:var(--accent);background:var(--accent-soft);outline:none}
.up-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.up-files{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.up-file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface2)}
.up-file .up-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.up-file small{color:var(--muted)}
.up-layout{margin:0 0 12px;padding-left:22px;columns:2;column-gap:20px;font-size:12.5px}
.up-layout li{padding:2px 0;break-inside:avoid}
.up-rules{margin:0 0 12px;padding-left:18px;color:var(--muted);font-size:12.5px}
.up-rules li{padding:2px 0}
@media (max-width:900px){.up-grid{grid-template-columns:1fr}}
.dropzone span{font-size:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* results */
.result-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.result-meta{font-size:12px;color:var(--muted);display:flex;gap:8px}
.result-meta b{color:var(--text)}
.result-actions{display:flex;gap:8px;align-items:center}
.tsearch{width:200px;height:30px;font-size:12px}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);max-height:62vh}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--fs-table,12.5px);font-variant-numeric:tabular-nums}
table.grid th{position:sticky;top:0;z-index:2;text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.02em;padding:9px 10px;background:var(--th-bg);color:var(--th-text);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
table.grid th.sorted::after{content:" ↓"}
table.grid tr.group-row th{top:0;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:var(--th-bg2,var(--surface2));border-bottom:1px solid var(--border);cursor:default}
table.grid tr.group-row th.grp{border-left:1px solid var(--border);border-right:1px solid var(--border)}
table.grid tr.group-row+tr th{top:33px}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--row-line,var(--border));white-space:nowrap;vertical-align:middle}
table.grid tbody tr:nth-child(even) td{background:var(--row-alt,transparent)}
table.grid tbody tr:hover td{background:var(--row-hover)}
table.grid th.num,table.grid td.num{text-align:right;font-family:var(--font-num,var(--font))}
table.grid td.strong{font-weight:700}
table.grid td.neg{color:var(--neg)}
table.grid td.mono{font-family:var(--font-mono);font-size:12px}
table.grid tfoot td{position:sticky;bottom:0;background:var(--tf-bg,var(--surface2));font-weight:700;border-top:2px solid var(--border);border-bottom:0}
table.grid td.sel,table.grid th.sel{width:34px;text-align:center}
.flag-dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-size:10.5px;font-weight:700}
td.flag.y .flag-dot{background:var(--ok-soft);color:var(--ok)}
td.flag.n .flag-dot{background:var(--neg-soft);color:var(--neg)}
.chip-status{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;line-height:1.6}
.chip-status.ok{background:var(--ok-soft);color:var(--ok)}
.chip-status.warn{background:var(--warn-soft);color:var(--warn)}
.chip-status.bad{background:var(--neg-soft);color:var(--neg)}
.tlink{font-weight:600}
.row-actions-in{display:flex;gap:4px;flex-wrap:nowrap}
.row-actions-in a{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.row-actions-in a:hover{border-color:var(--accent);color:var(--accent)}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.sum{flex:1;min-width:150px;padding:10px 14px;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border)}
.sum small{display:block;font-size:11px;color:var(--muted)}
.sum b{font-size:15px;font-family:var(--font-num,var(--font))}
.info-strip{display:flex;flex-wrap:wrap;gap:8px 28px;padding:10px 14px;margin-bottom:12px;border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border)}
.info-strip small{display:block;font-size:11px;color:var(--muted)}
.info-strip b{font-size:13.5px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:48px 20px;border:1px dashed var(--border);border-radius:var(--radius-lg,var(--radius));color:var(--muted);text-align:center}
.empty .ic{width:34px;height:34px;color:var(--accent);margin-bottom:6px}
.empty b{color:var(--text)}

@keyframes ripple{to{transform:scale(28);opacity:0}}

/* ---- inputs */
.field input,.field select,.tsearch,.editable input,.editable select,.qty{transition:border-color var(--t-fast),box-shadow var(--t-fast),background var(--t-fast)}
.field input:focus,.field select:focus,.tsearch:focus,.editable input:focus,.qty:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.sort-ic{display:inline-block;width:0;height:0;margin-left:6px;border:4px solid transparent;border-top-color:currentColor;opacity:0;transform:translateY(2px) rotate(0);transition:opacity var(--t-fast),transform var(--t-med) var(--ease)}

.illus-wrap{width:160px;max-width:60%;margin:0 auto 8px}

    }
    const dz = h('div', { class: 'dropzone', tabindex: '0', onclick: () => picker.click(), onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); picker.click(); } },
      ondragover: e => { e.preventDefault(); dz.classList.add('drag'); }, ondragleave: () => dz.classList.remove('drag'), ondrop: e => { e.preventDefault(); dz.classList.remove('drag'); setFiles(e.dataTransfer.files); } },
      illus('upload'), h('b', null, 'Drop ' + (spec.multi ? 'files' : 'the file') + ' here or click to choose'), h('span', null, spec.accept.join(', ') + ' · up to ' + spec.maxMb + ' MB' + (spec.multi ? ' each' : '')), picker);

    const host = h('div', { class: 'result-host' });
    const validate = () => {
      if (!files.length) { toast('Choose a file first', 'err'); dz.focus(); return; }
      step(2);
      if (!spec.preview) { step(3); toast(files.length + ' document(s) uploaded — sent for verification'); files = []; renderList(); return; }
      runWithSkeleton(host, () => {
        const rows = BO.genRows(spec.preview, 12, spec.reportType + 31);
        const si = spec.preview.findIndex(c => c.t === 'status');
        const bad = rows.filter(r => !/^(ok|matched|accepted)$/i.test(r[si])).length;
        const card = resultCard({ title: 'Validation preview — ' + files[0].name, columns: spec.preview, totals: spec.totals, resultActions: ['Download error rows'] }, rows,
          infoStrip([['File', files[0].name], ['Records read', String(rows.length)], ['Valid', String(rows.length - bad)], ['Errors', String(bad)]]));
        card.appendChild(h('div', { class: 'form-actions' }, h('button', { class: 'btn btn-ghost', onclick: () => { host.innerHTML = ''; step(1); } }, 'Cancel'),
          h('button', { class: 'btn btn-primary', onclick: () => { step(3); toast((rows.length - bad) + ' records posted · ' + bad + ' skipped — batch UB' + BO.ri(10000, 99999)); host.innerHTML = ''; files = []; renderList(); } }, icon('check'), 'Post ' + (rows.length - bad) + ' valid records')));
        return card;
      });
    };

    const form = h('section', { class: 'card' }, h('div', { class: 'card-title' }, 'Upload', h('small', null, 'report_type=' + spec.reportType)),
      h('div', { class: 'filters' }, ...spec.filters.map(field)), dz, list,
      h('div', { class: 'form-actions' }, h('button', { class: 'btn btn-ghost', onclick: () => { files = []; renderList(); host.innerHTML = ''; step(0); } }, 'Clear'),
        h('button', { class: 'btn btn-primary', onclick: validate }, icon('upload'), spec.preview ? 'Upload & Validate' : 'Upload')));

    const side = h('section', { class: 'card' }, h('div', { class: 'card-title' }, spec.layout ? 'File layout' : 'Guidelines', h('small', null, spec.accept.join(' / '))),
      spec.layout ? h('ol', { class: 'up-layout' }, ...spec.layout.map(x => h('li', null, x))) : null,
      spec.rules ? h('ul', { class: 'up-rules' }, ...spec.rules.map(x => h('li', null, x))) : null,
      spec.layout ? h('div', { class: 'form-actions left' }, h('button', { class: 'btn btn-ghost btn-sm', onclick: () => {
        const a = h('a', { href: URL.createObjectURL(new Blob([spec.layout.join(',') + '\n'], { type: 'text/csv' })), download: spec.title.replace(/\W+/g, '_') + '_sample.csv' }); a.click(); toast('Sample format downloaded');
      } }, icon('download'), 'Download sample format')) : null);

    body.appendChild(steps);
    body.appendChild(h('div', { class: 'two-col up-grid' }, form, side));
    body.appendChild(host);
    body.appendChild(resultCard({ title: 'Recent uploads', columns: spec.log }, BO.genRows(spec.log, 6, spec.reportType + 3)));
  };

  /* ------------------------------------------------------------------- init */
  window.addEventListener('DOMContentLoaded', () => { buildShell(); route(); });
  window.addEventListener('hashchange', route);
  window.BOAPP = { toast, state };
})();

</script>
</body>
</html>
